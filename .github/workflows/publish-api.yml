name: Publish API

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - 'db/**'
      - 'docker/api/**'
      - '.github/workflows/publish-api.yml'

  workflow_dispatch:

env:
  IMAGE_NAME: api
  GITHUB_IMAGE_REPO: ghcr.io/bcgov/jag-probate

permissions:
  id-token: write
  packages: write

jobs:
  build:
    name: Build and Push API Image
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.short_sha.outputs.SHORT_SHA }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Log in to the GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short SHA
        id: short_sha
        run: |
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Setup Image Metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: |
            ${{ env.GITHUB_IMAGE_REPO }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.short_sha.outputs.SHORT_SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and Push Image to ghcr.io
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          push: true
          context: .
          file: ./docker/api/Dockerfile.release
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  update-gitops-dev:
    name: Update GitOps Dev
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: bcgov-c/tenant-gitops-a94b15
          ref: develop
          token: ${{ secrets.GITOPS_DEPLOY_TOKEN }}
          path: gitops

      - name: Update API image tag
        working-directory: gitops/services/probate
        run: |
          TAG="${{ needs.build.outputs.short_sha }}"

          # Update kustomization.yaml with new API image tag
          sed -i "/name: jag-probate-api/,/newTag:/ s|newTag:.*|newTag: \"${TAG}\"|" kustomization.yaml

          echo "Updated API image tag to: ${TAG}"
          cat kustomization.yaml

      - name: Commit and push changes
        working-directory: gitops
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          git add services/probate/kustomization.yaml

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🚀 Deploy probate API to dev - SHA: ${{ needs.build.outputs.short_sha }}"
            
            # Pull with rebase and retry push logic
            max_retries=3
            retry_count=0
            
            while [ $retry_count -lt $max_retries ]; do
              git pull --rebase origin develop
              
              if git push origin develop; then
                echo "GitOps repository updated successfully!"
                break
              else
                retry_count=$((retry_count + 1))
                echo "Push failed, retry $retry_count/$max_retries"
                sleep 2
              fi
              
              if [ $retry_count -eq $max_retries ]; then
                echo "Failed to push after $max_retries attempts"
                exit 1
              fi
            done
          fi
