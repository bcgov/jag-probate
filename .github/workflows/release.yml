# Release workflow: builds versioned API and Web images from a GitHub Release tag,
# then promotes them through dev -> test -> prod environments via ArgoCD/Kustomize.
#
# Prerequisites - GitHub Environments must be configured in repo Settings -> Environments:
#   - "dev"  : no approval gates required (auto-deploys on release publish)
#   - "test" : configure required reviewers for manual approval before promotion
#   - "prod" : configure required reviewers for manual approval before promotion
#
# The "prod" deployment is additionally skipped for pre-release tags.

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.2.3"
        required: true
        type: string

env:
  GITHUB_IMAGE_REPO: ghcr.io/bcgov/jag-probate
  GITOPS_LICENCE_PLATE: a94b15
  WEB_BASE_HREF: /probate/

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: release-${{ github.event.release.tag_name || github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  setup:
    name: Resolve Image Tag
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.resolve.outputs.IMAGE_TAG }}
      release_ref: ${{ steps.resolve.outputs.RELEASE_REF }}
      is_prerelease: ${{ steps.resolve.outputs.IS_PRERELEASE }}
    steps:
      - name: Resolve tag and pre-release flag
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            RAW_TAG="${{ github.event.release.tag_name }}"
            IS_PRERELEASE="${{ github.event.release.prerelease }}"
          else
            RAW_TAG="${{ github.event.inputs.tag }}"
          fi
          IMAGE_TAG="${RAW_TAG#v}"
          if [ "${IS_PRERELEASE:-false}" = "true" ] || [[ "${IMAGE_TAG}" == *-* ]]; then
            IS_PRERELEASE="true"
          else
            IS_PRERELEASE="false"
          fi
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "RELEASE_REF=${RAW_TAG}" >> $GITHUB_OUTPUT
          echo "IS_PRERELEASE=${IS_PRERELEASE}" >> $GITHUB_OUTPUT

  build-api:
    name: Build and Push API Image
    needs: setup
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ needs.setup.outputs.image_tag }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.setup.outputs.release_ref }}

      - uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.GITHUB_IMAGE_REPO }}/api
          tags: type=raw,value=${{ needs.setup.outputs.image_tag }}

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          push: true
          context: .
          file: ./docker/api/Dockerfile.release
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-web:
    name: Build and Push Web Image
    needs: setup
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ needs.setup.outputs.image_tag }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.setup.outputs.release_ref }}

      - uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.GITHUB_IMAGE_REPO }}/web
          tags: type=raw,value=${{ needs.setup.outputs.image_tag }}

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
        with:
          driver: docker

      - uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          push: true
          context: .
          file: ./docker/web/Dockerfile.release
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NODE_VERSION=22
            WEB_BASE_HREF=${{ env.WEB_BASE_HREF }}
            NGINX_RUNTIME_SRC=./docker/nginx-runtime
            VUE_ON_NGINX_SRC=./docker/vue-on-nginx
            WEB_SRC=./web

  deploy-dev:
    name: Deploy to Dev
    needs: [build-api, build-web]
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Update images in dev
        uses: ./.github/workflows/actions/update-argo-kustomize
        with:
          licence_plate: ${{ env.GITOPS_LICENCE_PLATE }}
          gitops_branch: develop
          gitops_gh_token: ${{ secrets.GITOPS_DEPLOY_TOKEN }}
          image_name: jag-probate-api
          new_image: ${{ env.GITHUB_IMAGE_REPO }}/api:${{ needs.build-api.outputs.image_tag }}
          image_name_2: jag-probate-web
          new_image_2: ${{ env.GITHUB_IMAGE_REPO }}/web:${{ needs.build-web.outputs.image_tag }}
          kustomize_path: services/probate/overlays/dev

  deploy-test:
    name: Deploy to Test
    needs: [build-api, build-web, deploy-dev]
    runs-on: ubuntu-latest
    environment: test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Update images in test
        uses: ./.github/workflows/actions/update-argo-kustomize
        with:
          licence_plate: ${{ env.GITOPS_LICENCE_PLATE }}
          gitops_branch: test
          gitops_gh_token: ${{ secrets.GITOPS_DEPLOY_TOKEN }}
          image_name: jag-probate-api
          new_image: ${{ env.GITHUB_IMAGE_REPO }}/api:${{ needs.build-api.outputs.image_tag }}
          image_name_2: jag-probate-web
          new_image_2: ${{ env.GITHUB_IMAGE_REPO }}/web:${{ needs.build-web.outputs.image_tag }}
          kustomize_path: services/probate/overlays/test

  deploy-prod:
    name: Deploy to Prod
    needs: [setup, build-api, build-web, deploy-test]
    if: ${{ needs.setup.outputs.is_prerelease != 'true' }}
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Update images in prod
        uses: ./.github/workflows/actions/update-argo-kustomize
        with:
          licence_plate: ${{ env.GITOPS_LICENCE_PLATE }}
          gitops_branch: main
          gitops_gh_token: ${{ secrets.GITOPS_DEPLOY_TOKEN }}
          image_name: jag-probate-api
          new_image: ${{ env.GITHUB_IMAGE_REPO }}/api:${{ needs.build-api.outputs.image_tag }}
          image_name_2: jag-probate-web
          new_image_2: ${{ env.GITHUB_IMAGE_REPO }}/web:${{ needs.build-web.outputs.image_tag }}
          kustomize_path: services/probate/overlays/prod
