# Release workflow: builds versioned API and Web images from a GitHub Release tag,
# then promotes them through dev -> test environments via ArgoCD/Kustomize
# and opens a GitOps pull request for prod promotion.
#
# Prerequisites - GitHub Environments must be configured in repo Settings -> Environments:
#   - "dev"  : no approval gates required (auto-deploys on release publish)
#   - "test" : configure required reviewers for manual approval before promotion
#   - "prod" : configure required reviewers for manual approval before opening the prod GitOps PR

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.2.3"
        required: true
        type: string

env:
  GITHUB_IMAGE_REPO: ghcr.io/bcgov/jag-probate
  GITOPS_LICENCE_PLATE: a94b15

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.event.release.tag_name || github.event.inputs.tag || github.run_id }}
  cancel-in-progress: false

jobs:
  setup:
    name: Resolve Image Tag
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.resolve.outputs.IMAGE_TAG }}
      release_ref: ${{ steps.resolve.outputs.RELEASE_REF }}
    steps:
      - name: Resolve tag
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail

          if [ "${EVENT_NAME}" = "release" ]; then
            RAW_TAG="${RELEASE_TAG}"
          else
            RAW_TAG="${INPUT_TAG}"
          fi

          if [[ ! "${RAW_TAG}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "Release tag must match vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease, for example v1.2.3 or v1.2.3-rc1."
            exit 1
          fi

          IMAGE_TAG="${RAW_TAG#v}"
          {
            printf 'IMAGE_TAG=%s\n' "${IMAGE_TAG}"
            printf 'RELEASE_REF=%s\n' "${RAW_TAG}"
          } >> "$GITHUB_OUTPUT"

  build-images:
    name: Build and Push ${{ matrix.name }} Image
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API
            image: api
            dockerfile: ./docker/api/Dockerfile.release
            build_args: ""
          - name: Web
            image: web
            dockerfile: ./docker/web/Dockerfile.release
            build_args: |
              NODE_VERSION=22
              WEB_BASE_HREF=/probate/
              NGINX_RUNTIME_SRC=./docker/nginx-runtime
              VUE_ON_NGINX_SRC=./docker/vue-on-nginx
              WEB_SRC=./web
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup.outputs.release_ref }}

      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short SHA
        id: short_sha
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.GITHUB_IMAGE_REPO }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ needs.setup.outputs.image_tag }}
            type=raw,value=${{ steps.short_sha.outputs.SHORT_SHA }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          push: true
          context: .
          file: ${{ matrix.dockerfile }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}

  deploy-dev:
    name: Deploy to Dev
    needs: [setup, build-images]
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update images in dev
        uses: ./.github/actions/update-argo-kustomize
        with:
          licence_plate: ${{ env.GITOPS_LICENCE_PLATE }}
          gitops_branch: develop
          gitops_gh_token: ${{ secrets.GITOPS_DEPLOY_TOKEN }}
          image_name: jag-probate-api
          new_image: ${{ env.GITHUB_IMAGE_REPO }}/api:${{ needs.setup.outputs.image_tag }}
          image_name_2: jag-probate-web
          new_image_2: ${{ env.GITHUB_IMAGE_REPO }}/web:${{ needs.setup.outputs.image_tag }}
          kustomize_path: services/probate/overlays/dev

  deploy-test:
    name: Deploy to Test
    needs: [setup, build-images, deploy-dev]
    runs-on: ubuntu-latest
    environment: test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update images in test
        uses: ./.github/actions/update-argo-kustomize
        with:
          licence_plate: ${{ env.GITOPS_LICENCE_PLATE }}
          gitops_branch: test
          gitops_gh_token: ${{ secrets.GITOPS_DEPLOY_TOKEN }}
          image_name: jag-probate-api
          new_image: ${{ env.GITHUB_IMAGE_REPO }}/api:${{ needs.setup.outputs.image_tag }}
          image_name_2: jag-probate-web
          new_image_2: ${{ env.GITHUB_IMAGE_REPO }}/web:${{ needs.setup.outputs.image_tag }}
          kustomize_path: services/probate/overlays/test

  deploy-prod:
    name: Deploy to Prod
    needs: [setup, build-images, deploy-test]
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update images in prod
        uses: ./.github/actions/update-argo-kustomize
        with:
          licence_plate: ${{ env.GITOPS_LICENCE_PLATE }}
          gitops_branch: main
          gitops_gh_token: ${{ secrets.GITOPS_DEPLOY_TOKEN }}
          image_name: jag-probate-api
          new_image: ${{ env.GITHUB_IMAGE_REPO }}/api:${{ needs.setup.outputs.image_tag }}
          image_name_2: jag-probate-web
          new_image_2: ${{ env.GITHUB_IMAGE_REPO }}/web:${{ needs.setup.outputs.image_tag }}
          kustomize_path: services/probate/overlays/prod
          create_pull_request: 'true'
          pull_request_branch: release/promote-${{ needs.setup.outputs.release_ref }}-to-prod
          pull_request_base: main
          pull_request_title: Promote probate ${{ needs.setup.outputs.release_ref }} to prod
          pull_request_body: |
            Automated prod promotion PR for probate release ${{ needs.setup.outputs.release_ref }}.

            Images:
            - ${{ env.GITHUB_IMAGE_REPO }}/api:${{ needs.setup.outputs.image_tag }}
            - ${{ env.GITHUB_IMAGE_REPO }}/web:${{ needs.setup.outputs.image_tag }}
