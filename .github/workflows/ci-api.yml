name: Build and Test API

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main
    paths:
      - 'api/**'
      - 'db/**'

  workflow_dispatch:

env:
  WORKING_DIRECTORY: .
  NUGET_CERT_REVOCATION_MODE: offline

jobs:
  related-csproj:
    name: Find related csproj files
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      csproj-files: ${{ steps.filter.outputs.csharp-projects }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get all related csproj files
        id: filter
        run: |
          echo "csharp-projects=$(find api db -name '*.csproj' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

  build-and-test-api:
    name: Build and Test API
    needs: related-csproj
    if: needs.related-csproj.outputs.csproj-files != ''
    runs-on: ubuntu-latest
    permissions:
      packages: read
    env:
      PROBATE_MIGRATION_TEST_CONNECTION_STRING: Host=localhost;Port=5432;Database=probate_test;Username=postgres;Password=postgres
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: probate_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d probate_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Install CSharpier
        run: dotnet tool restore

      - name: Check CSharpier Formatting
        run: |
          for csproj in ${{ needs.related-csproj.outputs.csproj-files }}; do
            project_dir=$(dirname "$csproj")
            echo "Checking CSharpier formatting for $project_dir"
            dotnet csharpier check "$project_dir"
          done

      - name: Check Dotnet Format (Style)
        run: |
          for csproj in ${{ needs.related-csproj.outputs.csproj-files }}; do
            echo "Checking style formatting for $csproj"
            dotnet format style $csproj --verify-no-changes --verbosity diagnostic
          done

      - name: Check Dotnet Format (Analyzers)
        run: |
          for csproj in ${{ needs.related-csproj.outputs.csproj-files }}; do
            echo "Checking analyzers for $csproj"
            dotnet format analyzers $csproj --verify-no-changes --verbosity diagnostic
          done

      - name: Build API codebase
        uses: ./.github/actions/build-api
        with:
          working_directory: ${{ env.WORKING_DIRECTORY }}
          dotnet_version: 10.0

      - name: Test database cleanup migration
        run: dotnet test api.tests/api.tests.csproj --configuration Release --filter FullyQualifiedName~RemoveUnusedEntitiesMigrationTests
